<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- モバイル前提: 拡大縮小を抑え、ノッチ領域も使う -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>オービス警報（個人利用）</title>

  <!-- Leaflet CSS（バージョン固定 1.9.4） -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- 走行画面（メイン） -->
  <div id="app">
    <!-- 地図 -->
    <div id="map"></div>

    <!-- 上部HUD: 現在速度と状態 -->
    <div id="hud" class="hud-top">
      <div class="speed-box">
        <span id="speed-value" class="speed-value">--</span>
        <span class="speed-unit">km/h</span>
      </div>
      <div class="hud-info">
        <div id="status" class="status">初期化中…</div>
        <div id="heading-info" class="heading-info">進行方向: --</div>
      </div>
    </div>

    <!-- 下部操作バー -->
    <div class="controls">
      <button id="start-btn" class="btn-primary">測位開始</button>
    </div>
  </div>

  <!-- Leaflet JS（バージョン固定 1.9.4） -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- アプリ本体（ESモジュール） -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
